<title>SAT Prep · Админка</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: control-room table — summary tiles, then a user roster; selecting a row opens a detail panel. */
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#15213b; --muted:#5a647a; --line:#dce1ea; --soft:#eef1f6;
  --accent:#f2b705; --math:#d99a00; --eng:#7c4dff; --good:#1d7f55; --bad:#b8382f;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e131d;--card:#161d2b;--ink:#e6eaf2;--muted:#9aa4b9;--line:#2a3347;--soft:#1d2536;--accent:#f5c542;--math:#f5c542;--eng:#b794ff;--good:#43c48b;--bad:#f07067;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131d;--card:#161d2b;--ink:#e6eaf2;--muted:#9aa4b9;--line:#2a3347;--soft:#1d2536;--accent:#f5c542;--math:#f5c542;--eng:#b794ff;--good:#43c48b;--bad:#f07067;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin-right:auto;display:flex;gap:10px;align-items:center}
.badge{font-family:var(--f-mono);font-size:.7rem;background:var(--ink);color:var(--card);border-radius:5px;padding:2px 7px;letter-spacing:.06em}
main{padding-block:24px 60px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.gate{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px clamp(18px,4vw,40px);max-width:520px;margin:40px auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gate .lock{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.3rem}
.google-btn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,2.5vw,24px);min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.panel-head h2{font-size:1.1rem;margin-right:auto}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th[aria-sort]::after{content:" ↓";} th[aria-sort="ascending"]::after{content:" ↑"}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)} tbody tr[aria-selected="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.who{display:flex;flex-direction:column}.who small{color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.pill.on{color:var(--good)} .pill.off{color:var(--muted)}
.acc-good{color:var(--good)} .acc-bad{color:var(--bad)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.meter{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%} .meter .g{background:var(--good)} .meter .r{background:var(--bad)}
.num{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap}
.sub{font-family:var(--f-display);font-size:.95rem;margin:4px 0 6px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:640px){ .drow{grid-template-columns:minmax(0,1fr) auto} .drow .meter{grid-column:1/-1;order:3} }
</style>

,"expression","rhetorical_synthesis"],[1975,"english","expression","rhetorical_synthesis"],[1976,"english","expression","rhetorical_synthesis"],[1977,"english","expression","rhetorical_synthesis"],[1978,"english","expression","rhetorical_synthesis"],[1979,"english","expression","rhetorical_synthesis"],[1980,"english","expression","rhetorical_synthesis"],[1981,"english","expression","rhetorical_synthesis"],[1982,"english","expression","rhetorical_synthesis"],[1983,"english","expression","rhetorical_synthesis"],[1984,"english","expression","rhetorical_synthesis"],[1985,"english","expression","rhetorical_synthesis"],[1986,"english","expression","rhetorical_synthesis"],[1987,"english","expression","rhetorical_synthesis"],[1988,"english","expression","rhetorical_synthesis"],[1989,"english","expression","rhetorical_synthesis"],[1990,"english","expression","rhetorical_synthesis"],[1991,"english","expression","rhetorical_synthesis"],[1992,"english","expression","rhetorical_synthesis"],[1993,"english","expression","rhetorical_synthesis"],[1994,"english","expression","rhetorical_synthesis"],[1995,"english","expression","rhetorical_synthesis"],[1996,"english","expression","rhetorical_synthesis"],[1997,"english","expression","rhetorical_synthesis"],[1998,"english","expression","rhetorical_synthesis"],[1999,"english","expression","rhetorical_synthesis"],[2000,"english","expression","rhetorical_synthesis"]];</script>
<script>
(function(){
"use strict";
const META = new Map(window.META.map(m => [String(m[0]), {s:m[1], d:m[2], t:m[3]}]));
const DOM = {algebra:"Алгебра", advanced:"Продвинутая математика", psda:"Анализ данных", geometry:"Геометрия и тригонометрия",
  craft:"Ремесло и структура", info:"Информация и идеи", conventions:"Нормы английского", expression:"Выражение идей"};
const WD = {math:["algebra","advanced","psda","geometry"], english:["craft","info","conventions","expression"]};
const TOP = {linear_equations:"Линейные уравнения", linear_inequalities:"Линейные неравенства", systems_of_equations:"Системы уравнений", linear_functions:"Линейные функции",
  linear_models:"Линейные модели", quadratics:"Квадратные уравнения", exponents_radicals:"Степени и корни", exponential_models:"Экспоненты", polynomials:"Многочлены",
  functions:"Функции", rational_expressions:"Рациональные уравнения", nonlinear_systems:"Нелинейные системы", percentages:"Проценты", ratios_rates:"Отношения и скорости",
  units_conversion:"Перевод единиц", statistics:"Статистика", probability:"Вероятность", area_volume:"Площадь и объём", lines_angles_triangles:"Углы и треугольники",
  right_triangles:"Прямоугольные треугольники", circles:"Окружности", similarity:"Подобие", trigonometry:"Тригонометрия", coordinate_geometry:"Координаты",
  words_in_context:"Слова в контексте", command_of_evidence:"Аргументы", quantitative_evidence:"Данные из таблиц", subject_verb:"Согласование", pronouns:"Местоимения",
  verb_tense:"Времена", possessives:"Притяжательные", punctuation:"Пунктуация", modifiers:"Обороты", transitions:"Связки", rhetorical_synthesis:"Работа с заметками"};
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (c, n) => n ? Math.round(100 * c / n) : null;
const accCls = p => p == null ? "" : p >= 80 ? "acc-good" : p < 60 ? "acc-bad" : "";
function ago(ts){
  if (!ts) return "—";
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "только что"; if (m < 60) return m + " мин назад";
  const h = Math.round(m / 60); if (h < 24) return h + " ч назад";
  const d = Math.round(h / 24); return d + " дн назад";
}
const GOOGLE = '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';

/* Summaries computed from each user's progress document. */
function summarize(id, d){
  const u = {id, name:d.name || "", email:d.email || "", updated:d.updated || 0, tests:(d.tests || []).slice().sort((a, b) => b.d - a.d),
    w:{math:{n:0,c:0}, english:{n:0,c:0}}, dom:{}, top:{}};
  for (const [qid, r] of Object.entries(d.ans || {})) {
    const m = META.get(qid); if (!m) continue;
    u.w[m.s].n++; if (r.c) u.w[m.s].c++;
    (u.dom[m.d] = u.dom[m.d] || {n:0,c:0}).n++; if (r.c) u.dom[m.d].c++;
    (u.top[m.t] = u.top[m.t] || {n:0,c:0, s:m.s}).n++; if (r.c) u.top[m.t].c++;
  }
  u.total = u.w.math.n + u.w.english.n; u.correct = u.w.math.c + u.w.english.c;
  return u;
}

let users = [], sel = null, sortKey = "updated", sortDir = -1, unsub = null;
const COLS = [["name","Ученик"],["math","Math"],["english","English"],["tests","Тесты"],["updated","Активность"]];
const sortVal = (u, k) => k === "name" ? (u.name || u.email).toLowerCase() : k === "math" ? u.w.math.n : k === "english" ? u.w.english.n : k === "tests" ? u.tests.length : u.updated;

function render(){
  const week = Date.now() - 7 * 864e5;
  const total = users.reduce((a, u) => a + u.total, 0), corr = users.reduce((a, u) => a + u.correct, 0);
  const list = users.slice().sort((a, b) => { const x = sortVal(a, sortKey), y = sortVal(b, sortKey); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const cell = w => { const p = pct(w.c, w.n); return `${w.n}<span class="muted"> / 1000</span>${p == null ? "" : ` · <span class="${accCls(p)}">${p}%</span>`}`; };
  app.innerHTML = `
    <div class="tiles">
      <div class="tile"><span class="label">Учеников</span><b>${users.length}</b></div>
      <div class="tile"><span class="label">Активны за 7 дней</span><b>${users.filter(u => u.updated > week).length}</b></div>
      <div class="tile"><span class="label">Решено задач всего</span><b>${total.toLocaleString("ru")}</b></div>
      <div class="tile"><span class="label">Средняя точность</span><b>${total ? Math.round(100 * corr / total) + "%" : "—"}</b></div>
    </div>
    <section class="panel">
      <div class="panel-head"><h2>Ученики</h2><span class="muted" style="font-size:.85rem">Нажмите на строку, чтобы увидеть подробности</span></div>
      ${users.length ? `<div class="tablewrap"><table><thead><tr>${COLS.map(([k, l]) => `<th data-k="${k}" ${k === sortKey ? `aria-sort="${sortDir > 0 ? "ascending" : "descending"}"` : ""}>${l}</th>`).join("")}</tr></thead><tbody>
      ${list.map(u => { const best = u.tests.length ? Math.max(...u.tests.map(x => Math.round(100 * x.s / (x.n || 1)))) : null;
        return `<tr data-id="${esc(u.id)}" aria-selected="${sel === u.id}" tabindex="0">
          <td><div class="who"><b>${esc(u.name || "Без имени")}</b><small>${esc(u.email || u.id.slice(0, 8) + "…")}</small></div></td>
          <td class="n">${cell(u.w.math)}</td><td class="n">${cell(u.w.english)}</td>
          <td class="n">${u.tests.length}${best == null ? "" : ` · лучший ${best}%`}</td>
          <td><span class="pill ${u.updated > week ? "on" : "off"}">${ago(u.updated)}</span></td></tr>`; }).join("")}
      </tbody></table></div>` : `<div class="empty">Пока никто не вошёл на сайт через Google. Когда друг войдёт и решит задачу, он появится здесь.</div>`}
    </section>
    ${sel && users.find(u => u.id === sel) ? detail(users.find(u => u.id === sel)) : ""}`;
  app.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === "name" ? 1 : -1); sortKey = k; render(); }));
  app.querySelectorAll("tbody tr").forEach(tr => { const open = () => { sel = sel === tr.dataset.id ? null : tr.dataset.id; render(); if (sel) document.getElementById("detail")?.scrollIntoView({behavior:"smooth", block:"start"}); };
    tr.addEventListener("click", open); tr.addEventListener("keydown", e => { if (e.key === "Enter") open(); }); });
}
function detail(u){
  const block = w => `<div><div class="sub"><span class="dot" style="background:var(${w === "math" ? "--math" : "--eng"})"></span>${w === "math" ? "Math" : "English"}</div>
    ${WD[w].map(d => { const s = u.dom[d] || {n:0, c:0}; const p = pct(s.c, s.n);
      return `<div class="drow"><span>${DOM[d]}</span><div class="meter"><i class="g" style="width:${s.n ? 100 * s.c / s.n : 0}%"></i><i class="r" style="width:${s.n ? 100 * (s.n - s.c) / s.n : 0}%"></i></div><span class="num">${s.n} · <span class="${accCls(p)}">${p == null ? "—" : p + "%"}</span></span></div>`; }).join("")}</div>`;
  const weak = Object.entries(u.top).filter(([, s]) => s.n >= 3).map(([k, s]) => [k, s, pct(s.c, s.n)]).sort((a, b) => a[2] - b[2]).slice(0, 6);
  return `<section class="panel" id="detail">
    <div class="panel-head"><h2>${esc(u.name || "Без имени")}</h2><span class="muted">${esc(u.email)}</span></div>
    <div class="detail">
      ${block("math")}${block("english")}
      <div><div class="sub">Слабые темы</div>${weak.length ? `<ul class="plain">${weak.map(([k, s, p]) => `<li><span class="${accCls(p)}">${p}%</span> — ${esc(TOP[k] || k)} <span class="muted">(${s.c}/${s.n}, ${s.s === "math" ? "Math" : "English"})</span></li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Нужно решить хотя бы 3 задачи по теме.</p>`}</div>
      <div><div class="sub">Пробные тесты</div>${u.tests.length ? `<ul class="plain">${u.tests.slice(0, 10).map(x => `<li><span class="num">${new Date(x.d).toLocaleDateString("ru")}</span> · ${(x.w || "math") === "math" ? "Math" : "English"} · <b>${x.s}/${x.n}</b> <span class="${accCls(pct(x.s, x.n))}">(${pct(x.s, x.n)}%)</span></li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Тестов пока не было.</p>`}</div>
    </div></section>`;
}

function gate(kind, extra){
  const signIn = `<button class="google-btn" id="g-in" type="button">${GOOGLE}Войти через Google</button>`;
  app.innerHTML = kind === "signin"
    ? `<div class="gate"><div class="lock" aria-hidden="true">🔒</div><h1>Админ-панель</h1><p class="muted" style="margin:0">Войдите аккаунтом администратора.</p>${signIn}</div>`
    : kind === "denied"
    ? `<div class="gate"><div class="lock" aria-hidden="true">⛔</div><h1>Нет доступа</h1><p class="muted" style="margin:0">У аккаунта ${esc(extra)} нет прав администратора.</p><button class="btn primary" id="g-out" type="button">Выйти</button></div>`
    : `<div class="gate"><h1>Ошибка</h1><p class="muted" style="margin:0">${esc(extra)}</p></div>`;
  const b = document.getElementById("g-in"); if (b) b.addEventListener("click", signInGoogle);
  const o = document.getElementById("g-out"); if (o) o.addEventListener("click", () => firebase.auth().signOut());
}
function signInGoogle(){
  const auth = firebase.auth(), prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:"select_account"});
  auth.signInWithPopup(prov).catch(e => { if (e && e.code === "auth/popup-blocked") auth.signInWithRedirect(prov); });
}

if (!window.firebase || !window.FIREBASE_CONFIG) { gate("error", "Firebase не загрузился."); return; }
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();
document.getElementById("sign-out").addEventListener("click", () => auth.signOut());
auth.onAuthStateChanged(u => {
  if (unsub) { unsub(); unsub = null; }
  users = []; sel = null;
  document.getElementById("who").textContent = u ? (u.email || "") : "";
  document.getElementById("sign-out").hidden = !u;
  if (!u) return gate("signin");
  app.innerHTML = '<div class="empty">Загружаю данные…</div>';
  /* The database rules decide access: only the admin account may list all users. */
  unsub = db.collection("users").onSnapshot(snap => {
    users = snap.docs.map(d => summarize(d.id, d.data())); render();
  }, err => {
    if (err && err.code === "permission-denied") gate("denied", u.email || "");
    else gate("error", (err && err.message) || "Не удалось загрузить данные.");
  });
});
})();
</script>
