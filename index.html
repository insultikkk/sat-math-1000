<style>
/* Layout: sticky top bar with tabs; practice = filter rail + answer sheet card; answer choices drawn as answer-sheet bubbles. */
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#15213b; --muted:#5a647a; --line:#dce1ea; --soft:#eef1f6;
  --accent:#f2b705; --accent-ink:#6b4f00; --good:#1d7f55; --good-bg:#e5f4ec; --bad:#b8382f; --bad-bg:#fbe9e7;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --card:#161d2b; --ink:#e6eaf2; --muted:#9aa4b9; --line:#2a3347; --soft:#1d2536;
  --accent:#f5c542; --accent-ink:#f5c542; --good:#43c48b; --good-bg:#14322a; --bad:#f07067; --bad-bg:#3a1d1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --card:#161d2b; --ink:#e6eaf2; --muted:#9aa4b9; --line:#2a3347; --soft:#1d2536;
  --accent:#f5c542; --accent-ink:#f5c542; --good:#43c48b; --good-bg:#14322a; --bad:#f07067; --bad-bg:#3a1d1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-right:auto;letter-spacing:-.01em}
.brand .pencil{width:26px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--accent) 0 72%,#e9a2a2 72% 84%,#b9bdc6 84% 88%,var(--ink) 88%);transform:rotate(-20deg)}
.brand small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:4px}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--soft);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
main{padding-block:22px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.sync{margin:0 0 14px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sync .btn{padding:4px 10px;font-size:.8rem}
.sync.signin-card{background:var(--card);border:1.5px solid var(--accent);border-radius:14px;padding:16px 20px;gap:16px;justify-content:space-between;font-size:.92rem;color:var(--ink)}
.sync.signin-card::before{display:none}
.signin-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.signin-text b{font-family:var(--f-display);font-size:1.1rem}
.signin-text span{color:var(--muted)}
.google-btn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:12px 22px;font-size:1.05rem;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.google-btn:hover{background:#f6f8fc}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-state="cloud"]::before{background:var(--good)} .sync[data-state="error"]::before{background:var(--bad)} .sync[data-state="saving"]::before,.sync[data-state="loading"]::before{background:var(--accent)}

/* Practice */
.practice{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:76px}
.rail details{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px}
.rail summary{display:none}
.group{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px;font-size:.88rem}
.count{font-family:var(--f-mono);font-size:.82rem}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qnum{font-family:var(--f-mono);font-size:.9rem;background:var(--accent);color:#1b1500;border-radius:6px;padding:2px 8px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.tag.easy{color:var(--good);border-color:currentColor}.tag.medium{color:var(--accent-ink);border-color:currentColor}.tag.hard{color:var(--bad);border-color:currentColor}
.status{margin-left:auto;font-size:.8rem;font-weight:600}
.qtext{font-size:1.08rem;line-height:1.7;overflow-x:auto;overflow-y:hidden;max-width:68ch}
.qtext .katex{font-size:1.08em}
table.data{border-collapse:collapse;margin:12px 0;font-size:.92rem;font-variant-numeric:tabular-nums}
table.data th,table.data td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.data th{background:var(--soft);font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:52px}
.choice:hover{border-color:var(--muted)}
.bubble{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:500}
.choice.sel{border-color:var(--ink)} .choice.sel .bubble{background:var(--ink);color:var(--card)}
.choice.right{border-color:var(--good);background:var(--good-bg)} .choice.right .bubble{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)} .choice.wrong .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.choice .ct{min-width:0;overflow-x:auto}
.grid-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid-in input{width:180px;max-width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:1rem;background:var(--card)}
.grid-in input.right{border-color:var(--good);background:var(--good-bg)} .grid-in input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.hint{font-size:.84rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1b1500}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.verdict{font-weight:700;font-family:var(--f-display)}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.explain{border-left:3px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0;padding:12px 16px;line-height:1.75;overflow-x:auto}
.explain h3{font-size:.95rem;margin-bottom:4px}
a.ext{color:var(--ink);font-size:.86rem}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* Test */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:14px}
.intro{max-width:640px}
.facts{display:flex;flex-wrap:wrap;gap:22px}
.fact b{display:block;font-family:var(--f-display);font-size:1.6rem}
.testbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.timer{font-family:var(--f-mono);font-size:1.1rem;background:var(--soft);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.navgrid{display:flex;flex-wrap:wrap;gap:6px}
.navgrid button{width:36px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-family:var(--f-mono);font-size:.82rem;position:relative}
.navgrid button.done{background:var(--soft);border-color:var(--muted)}
.navgrid button.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.navgrid button.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.navgrid button.right{background:var(--good-bg);border-color:var(--good)} .navgrid button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.score{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.inline-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.drow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--good)} .meter .r{background:var(--bad)}
.num{font-family:var(--f-mono);font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
table.topics{width:100%;border-collapse:collapse;font-size:.9rem}
table.topics th,table.topics td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.topics td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.topics button{border:0;background:none;color:var(--ink);text-decoration:underline;padding:0;font-size:.85rem}
.legend{display:flex;gap:14px;font-size:.82rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

@media (max-width:820px){
  .practice{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .rail summary{display:block;font-weight:600;cursor:pointer}
  .rail details[open] summary{margin-bottom:12px}
  .drow{grid-template-columns:minmax(0,1fr) auto}
  .drow .meter{grid-column:1/-1;order:3}
}
@media (max-width:520px){ nav.tabs a{padding:6px 8px} .bar{gap:10px} }
@media (prefers-reduced-motion:no-preference){ .choice,.chip,.btn{transition:background-color .12s,border-color .12s} }

/* ---------- cloud sync: each signed-in person's progress lives in their own private db document ---------- */
const C = { ref:null, ready:false, writing:false, dirty:false, timer:null, state:"local" };
function setSync(state){
  C.state = state;
  const el = document.getElementById("sync"); if (!el) return;
  const txt = {
    local:{ru:"Прогресс: на этом устройстве", en:"Progress: this device only"},
    loading:{ru:"Загружаю прогресс…", en:"Loading progress…"},
    saving:{ru:"Сохраняю…", en:"Saving…"},
    cloud:{ru:"Прогресс сохранён в аккаунте", en:"Progress saved to your account"},
    error:{ru:"Нет связи с базой, прогресс сохранён на устройстве", en:"Can't reach the database; progress kept on this device"},
    signedOut:{ru:"Войдите, чтобы прогресс сохранялся в облаке", en:"Sign in to save your progress to the cloud"}
  }[state][S.lang];
  el.textContent = txt; el.dataset.state = state;
  el.classList.toggle("signin-card", !!C.auth && state === "signedOut");
  if (C.auth && state === "signedOut") {
    const ru = S.lang === "ru";
    el.innerHTML = `<div class="signin-text"><b>${ru ? "Сохраняйте прогресс в облаке" : "Save your progress to the cloud"}</b>
      <span>${ru ? "Войдите, чтобы решённые задачи и результаты тестов не потерялись и были доступны на любом устройстве." : "Sign in so your solved questions and test results are kept and available on any device."}</span></div>
      <button class="google-btn" id="sign-in" type="button"><svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>${ru ? "Войти через Google" : "Sign in with Google"}</button>`;
    el.querySelector("#sign-in").addEventListener("click", signIn);
    return;
  }
  if (C.auth) {
    const u = C.auth.currentUser;
    const b = document.createElement("button");
    b.className = "btn"; b.id = u ? "sign-out" : "sign-in";
    b.textContent = u ? (S.lang === "ru" ? "Выйти" : "Sign out") : (S.lang === "ru" ? "Войти через Google" : "Sign in with Google");
    b.addEventListener("click", () => u ? C.auth.signOut() : signIn());
    if (u) { const who = document.createElement("span"); who.textContent = "· " + (u.displayName || u.email || ""); el.append(" ", who); }
    el.append(" ", b);
  }
}
function mergeRemote(r){
  let changed = false;
  for (const [id, v] of Object.entries(r.ans || {})) {
    const cur = S.ans[id];
    if (!cur || (v.n || 0) > (cur.n || 0)) { S.ans[id] = v; changed = true; }
  }
  const seen = new Set(S.tests.map(x => x.d));
  for (const x of (r.tests || [])) if (!seen.has(x.d)) { S.tests.push(x); changed = true; }
  S.tests.sort((a, b) => a.d - b.d);
  return changed;
}
function cloudSave(){
  if (!C.ref || !C.ready) return;
  C.dirty = true; clearTimeout(C.timer);
  C.timer = setTimeout(flush, 1200);
}
async function flush(){
  if (C.writing || !C.dirty) return;
  C.writing = true; C.dirty = false; setSync("saving");
  try {
    await C.ref.set({ ans: S.ans, tests: S.tests.slice(-200), lang: S.lang, updated: Date.now() });
    setSync("cloud");
  } catch (e) {
    if (e && e.code === "unavailable") { C.dirty = true; setTimeout(flush, 2000 + Math.random() * 2000); }
    else { setSync("error"); if (e && (e.code === "invalid_argument" || e.code === "revoked")) C.ref = null; }
  } finally { C.writing = false; if (C.dirty) cloudSave(); }
}
async function cloudInit(){
  if (!window.claude || !window.claude.use) return setSync("local");
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) return setSync("local");
  setSync("loading");
  C.ref = db.doc("data/users/" + uid + "/progress");
  watch(C.ref, (next, fail) => C.ref.onSnapshot(s => next(s.exists, s.data(), s.metadata.hasPendingWrites, s.metadata.fromCache), fail));
}
/* Shared snapshot handling for both backends (claude.ai db and Firebase). */
function watch(ref, subscribe){
  const loadTimer = setTimeout(() => { if (!C.ready && C.ref === ref) setSync("error"); }, 10000);
  C.unsub = subscribe((exists, data, pending, fromCache) => {
    if (C.ref !== ref || pending) return;
    if (fromCache && C.ready) return;
    const first = !C.ready;
    const changed = exists ? mergeRemote(data) : false;
    if (!fromCache) { clearTimeout(loadTimer); C.ready = true; }
    if (changed) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} if (!(T && !T.done)) route(); }
    if (first && C.ready) {
      const remoteCount = exists ? Object.keys(data.ans || {}).length : -1;
      if (remoteCount !== Object.keys(S.ans).length) cloudSave(); else setSync("cloud");
    }
  }, () => { clearTimeout(loadTimer); setSync("error"); C.ref = null; });
}
/* GitHub Pages build: Firebase Auth (Google) + Firestore document users/{uid}. */
function firebaseInit(){
  if (!window.FIREBASE_CONFIG || !window.firebase) return false;
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore();
  C.auth = auth;
  auth.onAuthStateChanged(u => {
    if (C.unsub) { try { C.unsub(); } catch(e){} }
    C.ref = null; C.ready = false; C.unsub = null;
    if (!u) return setSync("signedOut");
    setSync("loading");
    const d = fs.collection("users").doc(u.uid);
    const ref = { set: data => d.set(data) };
    C.ref = ref;
    watch(ref, (next, fail) => d.onSnapshot(s => next(s.exists, s.data(), s.metadata.hasPendingWrites, s.metadata.fromCache), fail));
  });
  return true;
}
async function cloudStart(){
  if (firebaseInit()) return;
  await cloudInit();
}
function signIn(){
  if (!C.auth) return;
  C.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) C.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") setSync("error");
  });
}
const t = k => I18N[S.lang][k];
const topicName = k => TOPICS[k] ? TOPICS[k][S.lang === "ru" ? 0 : 1] : k;
const domName = k => DOMAINS[k][S.lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function math(el){
  if (window.renderMathInElement) {
    try { renderMathInElement(el, {delimiters:[{left:"\\(", right:"\\)", display:false}], throwOnError:false}); } catch(e){}
  }
}
function parseNum(s){
  s = String(s).trim().replace(",", ".").replace(/\s+/g, "");
  if (!s) return null;
  let m = s.match(/^(-?\d+)\/(\d+)$/);
  if (m) { const d = +m[2]; return d === 0 ? null : {v:+m[1]/d, exact:true}; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) { const dp = (s.split(".")[1] || "").length; return {v:parseFloat(s), exact:false, dp}; }
  return null;
}
function gridCorrect(q, p){
  const d = Math.abs(p.v - q.answer);
  if (d < 1e-9) return true;
  return !p.exact && p.dp >= 3 && d < Math.pow(10, -p.dp) * 1.01; // SAT accepts .666 / .667 for 2/3
}

const views = ["practice","test","progress"];
function route(){
  let r = (location.hash || "").slice(1);
  if (!views.includes(r)) r = "practice";
  views.forEach(v => document.getElementById("view-"+v).hidden = v !== r);
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.route === r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  ({practice:renderPractice, test:renderTest, progress:renderProgress})[r]();
}
window.addEventListener("hashchange", route);

/* ---------- practice ---------- */
let P = { list:[], idx:0, picked:null, checked:false, showExp:false, gridVal:"" };

function filtered(){
  const f = S.f;
  return Q.filter(q =>
    (f.domain === "all" || q.domain === f.domain) &&
    (f.diff === "all" || q.difficulty === f.diff) &&
    (f.topic === "all" || q.topic === f.topic) &&
    (f.st === "all" || (f.st === "new" && !S.ans[q.id]) || (f.st === "wrong" && S.ans[q.id] && !S.ans[q.id].c) || (f.st === "right" && S.ans[q.id] && S.ans[q.id].c)));
}
function chipGroup(name, items, cur){
  return `<div class="chips" role="group">${items.map(([v,l]) => `<button class="chip" data-f="${name}" data-v="${v}" aria-pressed="${cur === v}">${esc(l)}</button>`).join("")}</div>`;
}
function renderPractice(keepIdx){
  P.list = filtered();
  if (!keepIdx) {
    const i = P.list.findIndex(q => q.id === S.pos);
    P.idx = i >= 0 ? i : 0;
  }
  if (P.idx >= P.list.length) P.idx = 0;
  const f = S.f;
  const topicsForDomain = Object.keys(TOPICS).filter(k => f.domain === "all" || TOPIC_DOMAIN[k] === f.domain);
  const el = document.getElementById("view-practice");
  el.innerHTML = `<div class="practice">
    <aside class="rail"><details id="filters" ${P.railOpen ? "open" : ""}><summary>${t("filters")} · <span class="count">${P.list.length}</span></summary>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="group"><span class="label">${t("domain")}</span>${chipGroup("domain", [["all",t("all")], ...Object.keys(DOMAINS).map(k => [k, domName(k)])], f.domain)}</div>
        <div class="group"><span class="label">${t("difficulty")}</span>${chipGroup("diff", [["all",t("all")],["easy",t("easy")],["medium",t("medium")],["hard",t("hard")]], f.diff)}</div>
        <div class="group"><label class="label" for="topic-select">${t("topic")}</label><select id="topic-select"><option value="all">${t("allTopics")}</option>${topicsForDomain.map(k => `<option value="${k}" ${f.topic===k?"selected":""}>${esc(topicName(k))}</option>`).join("")}</select></div>
        <div class="group"><span class="label">${t("status")}</span>${chipGroup("st", [["all",t("stAll")],["new",t("stNew")],["wrong",t("stWrong")],["right",t("stRight")]], f.st)}</div>
        <div class="count muted">${t("shown")(P.list.length)}</div>
        <button class="btn" id="reset-filters">${t("reset")}</button>
      </div></details>
      <a class="ext" href="https://www.desmos.com/calculator" target="_blank" rel="noopener">${t("desmos")}</a>
    </aside>
    <div id="sheet" class="sheet"></div></div>`;
  el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    S.f[b.dataset.f] = b.dataset.v;
    if (b.dataset.f === "domain" && S.f.topic !== "all" && b.dataset.v !== "all" && TOPIC_DOMAIN[S.f.topic] !== b.dataset.v) S.f.topic = "all";
    save(); resetQ(); renderPractice(); }));
  el.querySelector("#topic-select").addEventListener("change", e => { S.f.topic = e.target.value; save(); resetQ(); renderPractice(); });
  el.querySelector("#reset-filters").addEventListener("click", () => { S.f = {domain:"all",diff:"all",topic:"all",st:"all"}; save(); resetQ(); renderPractice(); });
  renderSheet();
}
function resetQ(){ P.picked = null; P.checked = false; P.showExp = false; P.gridVal = ""; }

function renderSheet(){
  const sh = document.getElementById("sheet");
  if (!sh) return;
  if (!P.list.length) {
    sh.innerHTML = `<h2>${t("emptyTitle")}</h2><p class="muted">${t("emptyText")}</p>`;
    return;
  }
  const q = P.list[P.idx];
  S.pos = q.id; save();
  const rec = S.ans[q.id];
  const st = rec ? `<span class="status" style="color:var(${rec.c ? "--good" : "--bad"})">${rec.c ? "✓ "+t("solvedOk") : "✗ "+t("solvedBad")}</span>` : "";
  let body;
  if (q.type === "mc") {
    body = `<ul class="choices">${q.choices.map((c,i) => {
      let cls = "choice";
      if (P.checked) { if (i === q.answer) cls += " right"; else if (i === P.picked) cls += " wrong"; }
      else if (i === P.picked) cls += " sel";
      return `<li><button class="${cls}" data-c="${i}" ${P.checked ? "disabled" : ""} aria-label="${LETTERS[i]}"><span class="bubble">${LETTERS[i]}</span><span class="ct">${c}</span></button></li>`;
    }).join("")}</ul>`;
  } else {
    const ok = P.checked ? (P.lastOk ? "right" : "wrong") : "";
    body = `<div class="grid-in"><input id="grid-input" class="${ok}" inputmode="decimal" autocomplete="off" placeholder="${t("gridPh")}" value="${esc(P.gridVal)}" ${P.checked ? "disabled" : ""} aria-label="${t("gridPh")}"></div><div class="hint muted" id="grid-msg">${t("gridHint")}</div>`;
  }
  let verdict = "";
  if (P.checked) {
    const ans = q.type === "mc" ? `<b>${LETTERS[q.answer]}</b>` : `<b>${esc(q.answer_display)}</b>`;
    verdict = `<div><span class="verdict ${P.lastOk ? "ok" : "no"}">${P.lastOk ? t("correct") : t("incorrect")}</span> ${P.lastOk ? "" : `<span>${t("correctIs")} ${ans}</span>`}</div>`;
  }
  const exp = (P.checked || P.showExp) ? `<div class="explain"><h3>${t("explanation")}</h3><div>${q.exp[S.lang]}</div></div>` : "";
  sh.innerHTML = `
    <div class="qhead"><span class="qnum">#${q.id}</span><span class="tag">${esc(domName(q.domain))}</span><span class="tag">${esc(topicName(q.topic))}</span><span class="tag ${q.difficulty}">${t(q.difficulty)}</span><span class="tag">${q.type === "mc" ? t("mc") : t("grid")}</span>${st}</div>
    <div class="qtext">${q.q}</div>
    ${body}
    ${verdict}
    <div class="actions">
      <button class="btn primary" id="check" ${P.checked ? "disabled" : ""}>${t("check")}</button>
      ${P.checked || P.showExp ? "" : `<button class="btn" id="show-exp">${t("showExp")}</button>`}
      <span class="spacer"></span>
      <span class="count muted">${t("question")} ${P.idx+1} ${t("of")} ${P.list.length}</span>
      <button class="btn" id="prev" ${P.idx === 0 ? "disabled" : ""}>← ${t("prev")}</button>
      <button class="btn" id="rand">${t("random")}</button>
      <button class="btn accent" id="next">${t("next")} →</button>
    </div>
    ${exp}
    <div class="hint muted">${t("keys")}</div>`;
  math(sh);
  sh.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => { P.picked = +b.dataset.c; renderSheet(); }));
  const gi = sh.querySelector("#grid-input");
  if (gi) { gi.addEventListener("input", e => P.gridVal = e.target.value); gi.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } }); }
  sh.querySelector("#check").addEventListener("click", check);
  const se = sh.querySelector("#show-exp"); if (se) se.addEventListener("click", () => { P.showExp = true; renderSheet(); });
  sh.querySelector("#prev").addEventListener("click", () => go(P.idx - 1));
  sh.querySelector("#next").addEventListener("click", () => go(P.idx + 1));
  sh.querySelector("#rand").addEventListener("click", () => go(Math.floor(Math.random() * P.list.length)));
}
function go(i){
  if (!P.list.length) return;
  P.idx = (i + P.list.length) % P.list.length; resetQ();
  // keep the list stable while paging, even if status filters would now exclude the current item
  renderSheet();
  const sh = document.getElementById("sheet"); if (sh && sh.getBoundingClientRect().top < 0) sh.scrollIntoView({block:"start"});
}
function record(q, ok){
  const r = S.ans[q.id] || {n:0};
  S.ans[q.id] = {c: ok ? 1 : 0, n: r.n + 1}; save();
}
function check(){
  const q = P.list[P.idx]; if (!q || P.checked) return;
  if (q.type === "mc") {
    if (P.picked === null) return;
    P.lastOk = P.picked === q.answer;
  } else {
    const p = parseNum(P.gridVal);
    if (!p) { const m = document.getElementById("grid-msg"); if (m) { m.textContent = t("invalid"); m.style.color = "var(--bad)"; } return; }
    P.lastOk = gridCorrect(q, p);
  }
  P.checked = true; record(q, P.lastOk); renderSheet();
}
document.addEventListener("keydown", e => {
  if (document.getElementById("view-practice").hidden) return;
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = P.list[P.idx]; if (!q) return;
  const k = e.key.toUpperCase();
  if (q.type === "mc" && !P.checked) {
    let i = "1234".indexOf(k); if (i < 0) i = LETTERS.indexOf(k);
    if (i >= 0 && k.length === 1) { P.picked = i; renderSheet(); return; }
  }
  if (e.key === "Enter") { e.preventDefault(); P.checked ? go(P.idx + 1) : check(); }
  else if (e.key === "ArrowRight") go(P.idx + 1);
  else if (e.key === "ArrowLeft" && P.idx > 0) go(P.idx - 1);
});

/* ---------- test ---------- */
const MIX = {algebra:8, advanced:8, psda:3, geometry:3};
let T = null; // {ids, ans:{}, flags:{}, cur, end, done, timer}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newTest(){
  const ids = [];
  for (const [d, n] of Object.entries(MIX)) ids.push(...shuffle(Q.filter(q => q.domain === d)).slice(0, n).map(q => q.id));
  ids.sort((a, b) => ({easy:0,medium:1,hard:2}[byId.get(a).difficulty] - {easy:0,medium:1,hard:2}[byId.get(b).difficulty]) || Math.random() - .5);
  T = {ids, ans:{}, flags:{}, cur:0, end: Date.now() + 35 * 60 * 1000, done:false, confirm:false};
  tick(); renderTest();
}
function tick(){
  clearInterval(tick.h);
  tick.h = setInterval(() => {
    if (!T || T.done) return clearInterval(tick.h);
    const left = T.end - Date.now();
    const el = document.getElementById("timer");
    if (left <= 0) { T.timeUp = true; finishTest(); return; }
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 5 * 60 * 1000); }
  }, 500);
}
function fmtTime(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function testCorrect(q, a){
  if (a === undefined || a === null || a === "") return false;
  if (q.type === "mc") return a === q.answer;
  const p = parseNum(a); return !!p && gridCorrect(q, p);
}
function finishTest(){
  T.done = true; T.confirm = false; clearInterval(tick.h);
  let right = 0;
  T.ids.forEach(id => { const q = byId.get(id); const ok = testCorrect(q, T.ans[id]); if (ok) right++; if (T.ans[id] !== undefined && T.ans[id] !== "") record(q, ok); });
  T.score = right;
  S.tests.push({d: Date.now(), s: right, n: T.ids.length}); save();
  renderTest();
}
function renderTest(){
  const el = document.getElementById("view-test");
  if (!T) {
    const best = S.tests.length ? Math.max(...S.tests.map(x => x.s)) : null;
    el.innerHTML = `<div class="panel intro">
      <h1>${t("testTitle")}</h1><p class="muted" style="margin:0">${t("testIntro")}</p>
      <div class="facts"><div class="fact"><b>22</b>${t("qs")}</div><div class="fact"><b>35</b>${t("min")}</div><div class="fact"><b>4</b>${t("sections")}</div>${best !== null ? `<div class="fact"><b>${best}/22</b>${t("best")}</div>` : ""}</div>
      <div><button class="btn primary" id="start-test">${t("start")}</button></div></div>`;
    el.querySelector("#start-test").addEventListener("click", newTest);
    return;
  }
  if (T.done) return renderResults(el);
  const id = T.ids[T.cur], q = byId.get(id), a = T.ans[id];
  const unanswered = T.ids.filter(i => T.ans[i] === undefined || T.ans[i] === "").length;
  let body;
  if (q.type === "mc") {
    body = `<ul class="choices">${q.choices.map((c, i) => `<li><button class="choice ${a === i ? "sel" : ""}" data-c="${i}"><span class="bubble">${LETTERS[i]}</span><span class="ct">${c}</span></button></li>`).join("")}</ul>`;
  } else {
    body = `<div class="grid-in"><input id="test-grid" inputmode="decimal" autocomplete="off" placeholder="${t("gridPh")}" value="${esc(a || "")}" aria-label="${t("gridPh")}"></div><div class="hint muted">${t("gridHint")}</div>`;
  }
  el.innerHTML = `<div class="panel">
    <div class="testbar"><span class="timer" id="timer">${fmtTime(T.end - Date.now())}</span><span class="spacer"></span>
      ${T.confirm ? `<span class="inline-confirm"><span>${t("confirmFinish")(unanswered)}</span><button class="btn primary" id="yes-finish">${t("yesFinish")}</button><button class="btn" id="no-finish">${t("cancel")}</button></span>`
                  : `<button class="btn primary" id="finish">${t("finish")}</button>`}</div>
    <div class="navgrid">${T.ids.map((x, i) => `<button class="${i === T.cur ? "cur " : ""}${T.ans[x] !== undefined && T.ans[x] !== "" ? "done " : ""}${T.flags[x] ? "flag" : ""}" data-n="${i}" aria-label="${i+1}">${i+1}</button>`).join("")}</div>
    <div class="qhead"><span class="qnum">${T.cur+1} / 22</span><span class="tag">${esc(domName(q.domain))}</span><span class="tag ${q.difficulty}">${t(q.difficulty)}</span></div>
    <div class="qtext">${q.q}</div>${body}
    <div class="actions"><button class="btn" id="t-prev" ${T.cur === 0 ? "disabled" : ""}>← ${t("prev")}</button>
      <button class="btn" id="t-flag">${T.flags[id] ? t("unflag") : t("flag")}</button><span class="spacer"></span>
      <a class="ext" href="https://www.desmos.com/calculator" target="_blank" rel="noopener">${t("desmos")}</a>
      <button class="btn accent" id="t-next" ${T.cur === T.ids.length - 1 ? "disabled" : ""}>${t("next")} →</button></div></div>`;
  math(el);
  el.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => { T.ans[id] = +b.dataset.c; renderTest(); }));
  const gi = el.querySelector("#test-grid"); if (gi) gi.addEventListener("input", e => { T.ans[id] = e.target.value; });
  if (gi) gi.addEventListener("change", () => renderTest());
  el.querySelectorAll(".navgrid button").forEach(b => b.addEventListener("click", () => { T.cur = +b.dataset.n; renderTest(); }));
  el.querySelector("#t-prev").addEventListener("click", () => { T.cur--; renderTest(); });
  el.querySelector("#t-next").addEventListener("click", () => { T.cur++; renderTest(); });
  el.querySelector("#t-flag").addEventListener("click", () => { T.flags[id] = !T.flags[id]; renderTest(); });
  const fin = el.querySelector("#finish"); if (fin) fin.addEventListener("click", () => { if (unanswered) { T.confirm = true; renderTest(); } else finishTest(); });
  const yf = el.querySelector("#yes-finish"); if (yf) yf.addEventListener("click", finishTest);
  const nf = el.querySelector("#no-finish"); if (nf) nf.addEventListener("click", () => { T.confirm = false; renderTest(); });
}
function renderResults(el){
  const per = {};
  T.ids.forEach(id => { const q = byId.get(id); per[q.domain] = per[q.domain] || [0,0]; per[q.domain][1]++; if (testCorrect(q, T.ans[id])) per[q.domain][0]++; });
  const sel = T.reviewIdx;
  let review = "";
  if (sel !== undefined) {
    const id = T.ids[sel], q = byId.get(id), a = T.ans[id];
    const yours = a === undefined || a === "" ? t("noAns") : (q.type === "mc" ? LETTERS[a] : esc(a));
    const corr = q.type === "mc" ? LETTERS[q.answer] : esc(q.answer_display);
    review = `<div class="sheet" style="margin-top:6px"><div class="qhead"><span class="qnum">${sel+1}</span><span class="tag">${esc(topicName(q.topic))}</span><span class="tag ${q.difficulty}">${t(q.difficulty)}</span></div>
      <div class="qtext">${q.q}</div>
      ${q.type === "mc" ? `<ul class="choices">${q.choices.map((c,i) => `<li><div class="choice ${i === q.answer ? "right" : (i === a ? "wrong" : "")}"><span class="bubble">${LETTERS[i]}</span><span class="ct">${c}</span></div></li>`).join("")}</ul>` : ""}
      <div>${t("yourAns")} <b>${yours}</b> · ${t("correctIs")} <b>${corr}</b></div>
      <div class="explain"><h3>${t("explanation")}</h3><div>${q.exp[S.lang]}</div></div></div>`;
  }
  el.innerHTML = `<div class="panel">
    ${T.timeUp ? `<p class="verdict no" style="margin:0">${t("timeUp")}</p>` : ""}
    <span class="label">${t("result")}</span>
    <div class="score">${T.score} / ${T.ids.length}</div>
    <div class="muted">${Math.round(100 * T.score / T.ids.length)}%</div>
    <h3>${t("byDomain")}</h3>
    <div>${Object.keys(MIX).map(d => { const [r, n] = per[d] || [0,0]; return `<div class="drow"><span>${esc(domName(d))}</span><div class="meter"><i class="g" style="width:${n ? 100*r/n : 0}%"></i><i class="r" style="width:${n ? 100*(n-r)/n : 0}%"></i></div><span class="num">${r}/${n}</span></div>`; }).join("")}</div>
    <h3>${t("review")}</h3>
    <div class="navgrid">${T.ids.map((id, i) => `<button class="${testCorrect(byId.get(id), T.ans[id]) ? "right" : "wrong"}${sel === i ? " cur" : ""}" data-n="${i}">${i+1}</button>`).join("")}</div>
    ${review}
    <div><button class="btn primary" id="again">${t("again")}</button></div></div>`;
  math(el);
  el.querySelectorAll(".navgrid button").forEach(b => b.addEventListener("click", () => { T.reviewIdx = +b.dataset.n; renderTest(); }));
  el.querySelector("#again").addEventListener("click", newTest);
}

/* ---------- progress ---------- */
let confirmReset = false;
function renderProgress(){
  const el = document.getElementById("view-progress");
  const done = Object.keys(S.ans).length, ok = Object.values(S.ans).filter(r => r.c).length;
  const wrong = done - ok;
  const dstat = {}, tstat = {};
  Q.forEach(q => {
    dstat[q.domain] = dstat[q.domain] || {n:0, d:0, c:0}; tstat[q.topic] = tstat[q.topic] || {n:0, d:0, c:0};
    dstat[q.domain].n++; tstat[q.topic].n++;
    const r = S.ans[q.id]; if (r) { dstat[q.domain].d++; tstat[q.topic].d++; if (r.c) { dstat[q.domain].c++; tstat[q.topic].c++; } }
  });
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:18px">
    <h1>${t("progTitle")}</h1>
    <div class="stats">
      <div class="stat"><span class="label">${t("solved")}</span><b>${done} <span class="muted" style="font-size:1rem">/ 1000</span></b></div>
      <div class="stat"><span class="label">${t("accuracy")}</span><b>${done ? Math.round(100 * ok / done) + "%" : "—"}</b></div>
      <div class="stat"><span class="label">${t("mistakes")}</span><b>${wrong}</b></div>
      <div class="stat"><span class="label">${t("tests")}</span><b>${S.tests.length}</b></div>
    </div>
    ${done ? "" : `<p class="muted" style="margin:0">${t("noData")}</p>`}
    <div class="panel"><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><h2 style="font-size:1.1rem;margin-right:auto">${t("byDomain")}</h2>
      <div class="legend"><span style="--c:var(--good)">${t("legendOk")}</span><span style="--c:var(--bad)">${t("legendBad")}</span></div></div>
      <div>${Object.keys(DOMAINS).map(d => { const s = dstat[d]; return `<div class="drow"><span>${esc(domName(d))}</span><div class="meter"><i class="g" style="width:${100*s.c/s.n}%"></i><i class="r" style="width:${100*(s.d-s.c)/s.n}%"></i></div><span class="num">${s.d}/${s.n} ${t("attempted")}</span></div>`; }).join("")}</div></div>
    <div class="panel"><h2 style="font-size:1.1rem">${t("topics")}</h2><div class="tablewrap"><table class="topics"><thead><tr><th>${t("topic")}</th><th>${t("attempted")}</th><th>${t("accuracy")}</th><th></th></tr></thead><tbody>
      ${Object.keys(TOPICS).filter(k => tstat[k]).map(k => { const s = tstat[k]; return `<tr><td>${esc(topicName(k))}<div class="muted" style="font-size:.78rem">${esc(domName(TOPIC_DOMAIN[k]))}</div></td><td class="n">${s.d}/${s.n}</td><td class="n" style="color:${s.d ? (s.c/s.d >= .8 ? "var(--good)" : s.c/s.d < .6 ? "var(--bad)" : "inherit") : "inherit"}">${s.d ? Math.round(100*s.c/s.d) + "%" : "—"}</td><td><button data-topic="${k}">${t("practiceTopic")} →</button></td></tr>`; }).join("")}
    </tbody></table></div></div>
    <div class="inline-confirm">${confirmReset ? `<span>${t("resetConfirm")}</span><button class="btn primary" id="yes-reset">${t("yesReset")}</button><button class="btn" id="no-reset">${S.lang === "ru" ? "Отмена" : "Cancel"}</button>` : `<button class="btn" id="reset-prog">${t("resetProg")}</button>`}<span class="muted hint">${t("progNote")}</span></div>
  </div>`;
  el.querySelectorAll("[data-topic]").forEach(b => b.addEventListener("click", () => { S.f = {domain:TOPIC_DOMAIN[b.dataset.topic], diff:"all", topic:b.dataset.topic, st:"all"}; S.pos = 0; save(); resetQ(); location.hash = "practice"; }));
  const rp = el.querySelector("#reset-prog"); if (rp) rp.addEventListener("click", () => { confirmReset = true; renderProgress(); });
  const yr = el.querySelector("#yes-reset"); if (yr) yr.addEventListener("click", () => { S.ans = {}; S.tests = []; save(); confirmReset = false; renderProgress(); });
  const nr = el.querySelector("#no-reset"); if (nr) nr.addEventListener("click", () => { confirmReset = false; renderProgress(); });
}

/* filters panel: always open on wide screens (its toggle is hidden there) */
const wide = matchMedia("(min-width:821px)");
const syncRail = () => {
  const d = document.getElementById("filters"); if (!d) return;
  if (wide.matches) d.open = true;
  if (!d.dataset.bound) { d.dataset.bound = "1"; d.addEventListener("toggle", () => { if (!wide.matches) P.railOpen = d.open; }); }
};
if (wide.addEventListener) wide.addEventListener("change", syncRail);
new MutationObserver(syncRail).observe(document.getElementById("view-practice"), {childList:true});

/* boot */
function boot(){ setLang(S.lang === "en" ? "en" : "ru"); cloudStart().catch(() => setSync("local")); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
// re-typeset once KaTeX finishes loading if it arrived late
window.addEventListener("load", () => { document.querySelectorAll("main section:not([hidden])").forEach(math); });
})();
</script>
